name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, zip, intl, bcmath
          coverage: none

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (syntax)
        run: find app routes config database bootstrap -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Production cache'leri derlenebiliyor mu
        run: |
          php artisan route:cache && php artisan route:clear
          php artisan config:cache && php artisan config:clear
          php artisan view:cache && php artisan view:clear

      - name: Tests
        run: php artisan test

      - name: Güvenlik açığı taraması (bağımlılıklar)
        run: composer audit --no-interaction
        continue-on-error: true
