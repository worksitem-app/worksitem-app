name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, gd, zip, intl, bcmath
          coverage: none

      - name: Composer cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (syntax)
        run: find app routes config database bootstrap -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Production cache'leri derlenebiliyor mu
        run: |
          php artisan route:cache && php artisan route:clear
          php artisan config:cache && php artisan config:clear
          php artisan view:cache && php artisan view:clear

      - name: Tests
        run: php artisan test

      - name: Güvenlik açığı taraması (bağımlılıklar)
        run: composer audit --no-interaction
        continue-on-error: true
