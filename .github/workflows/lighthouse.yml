# v83: Ücretsiz hız ve SEO ölçümü — Google PageSpeed Insights (Lighthouse'u Google sunucularında çalıştırır)
#
# Neden GitHub'da Chrome değil: Hostinger CDN'i veri merkezi tarayıcılarına "Checking your browser…"
# bot kontrolü gösteriyor (20.10.2026 teşhisi); GitHub'daki Chrome 403 alıyor. PageSpeed Insights
# Google'dan ölçer, ayrıca gerçek kullanıcı verisini (CrUX) de verir.
#
# - Her pazartesi 06:30 (İstanbul) ve elle (Actions › Lighthouse › Run workflow) çalışır.
# - Anahtarsız çalışır. Kota hatası (429) görülürse ücretsiz bir Google API anahtarı
#   PSI_API_KEY adıyla repo gizli anahtarlarına eklenebilir (isteğe bağlı).
# - Eşiklerin altı yalnız UYARI verir; iş kırmızıya dönmez. Puan tablosu iş özetinde.

name: Lighthouse

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: PageSpeed Insights (mobil)
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          PAGES: |
            /
            /araclar
            /maliyet-hesapla
            /araclar/banyo-maliyet-hesaplayici
            /araclar/boya-hesaplayici
            /araclar/ges-planlayici
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request, urllib.error

          BASE = 'https://worksitem.com'
          MIN = {'performance': 70, 'seo': 95, 'accessibility': 85, 'best-practices': 85}
          key = os.environ.get('PSI_API_KEY', '').strip()
          pages = [p.strip() for p in os.environ['PAGES'].splitlines() if p.strip()]

          def psi(url):
              q = [('url', url), ('strategy', 'mobile'), ('locale', 'tr')] + [('category', c) for c in MIN]
              if key:
                  q.append(('key', key))
              api = 'https://www.googleapis.com/pagespeedonline/v5/runPagespeed?' + urllib.parse.urlencode(q)
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(api, timeout=120) as r:
                          return json.load(r), None
                  except urllib.error.HTTPError as e:
                      body = e.read().decode('utf-8', 'replace')[:300]
                      if e.code in (429, 500, 503) and attempt < 3:
                          time.sleep(20 * (attempt + 1)); continue
                      return None, f'HTTP {e.code}: {body}'
                  except Exception as e:
                      if attempt < 3:
                          time.sleep(10); continue
                      return None, str(e)[:300]

          def note(level, title, msg):
              print(f'::{level} title={title}::{msg}')

          rows, warns = [], 0
          for p in pages:
              url = BASE + p
              d, err = psi(url)
              if err or not d:
                  note('warning', f'PSI {p}', err or 'yanıt yok'); warns += 1
                  rows.append(f'| {p} | hata | | | | | | | {err[:80] if err else ""} |'); continue
              lr = d.get('lighthouseResult', {})
              if lr.get('runtimeError'):
                  m = lr['runtimeError'].get('message', '')[:200]
                  note('warning', f'PSI {p}', m); warns += 1
                  rows.append(f'| {p} | hata | | | | | | | {m[:80]} |'); continue
              cat = {k: round((v.get('score') or 0) * 100) for k, v in lr.get('categories', {}).items()}
              au = lr.get('audits', {})
              dv = lambda k: (au.get(k, {}).get('displayValue') or '-').replace(' ', ' ')
              field = (d.get('loadingExperience') or {}).get('overall_category') or 'veri yok'
              low = [f'{k} {cat.get(k)}<{v}' for k, v in MIN.items() if cat.get(k, 0) < v]
              if low:
                  note('warning', f'Düşük puan {p}', ', '.join(low)); warns += 1
              rows.append(f"| {p} | {cat.get('performance','-')} | {cat.get('seo','-')} | {cat.get('accessibility','-')} | {cat.get('best-practices','-')} | {dv('largest-contentful-paint')} | {dv('cumulative-layout-shift')} | {dv('total-blocking-time')} | {field} |")
              note('notice', f'Puan {p}', f"perf {cat.get('performance')} · seo {cat.get('seo')} · erişil. {cat.get('accessibility')} · en iyi {cat.get('best-practices')} · LCP {dv('largest-contentful-paint')} · CLS {dv('cumulative-layout-shift')} · TBT {dv('total-blocking-time')} · gerçek kullanıcı {field}")
              # Teşhis: ana içerik öğesi, LCP evreleri, engelleyen dosyalar, kayma kaynakları
              def items(k):
                  return ((au.get(k) or {}).get('details') or {}).get('items') or []
              def flat(it):
                  out = []
                  for x in it:
                      if isinstance(x, dict) and x.get('type') in ('table', 'list') and 'items' in x:
                          out += flat(x['items'])
                      else:
                          out.append(x)
                  return out
              lcp_el = [ (x.get('node') or {}).get('snippet', '') for x in flat(items('largest-contentful-paint-element')) if isinstance(x, dict) and x.get('node') ]
              if lcp_el:
                  note('notice', f'LCP öğesi {p}', lcp_el[0][:250])
              ph = [f"{x.get('phase') or x.get('label')}: {round(x.get('timing') or x.get('duration') or 0)} ms" for x in flat(items('lcp-breakdown-insight') or items('largest-contentful-paint-element')) if isinstance(x, dict) and (x.get('phase') or x.get('label')) and (x.get('timing') is not None or x.get('duration') is not None)]
              if ph:
                  note('notice', f'LCP evreleri {p}', ' · '.join(ph)[:300])
              rb = [f"{(x.get('url') or '')[-80:]} ({round(x.get('wastedMs') or 0)} ms)" for x in flat(items('render-blocking-insight') or items('render-blocking-resources')) if isinstance(x, dict) and x.get('url')]
              if rb:
                  note('notice', f'Engelleyen {p}', ' | '.join(rb)[:400])
              ls = [ ((x.get('node') or {}).get('snippet') or x.get('extra', {}).get('value', '') or '')[:120] + f" ({round(x.get('score') or 0, 3)})" for x in flat(items('cls-culprits-insight') or items('layout-shifts')) if isinstance(x, dict) and (x.get('node') or x.get('score'))]
              if ls:
                  note('notice', f'Kayma {p}', ' | '.join(ls[:4])[:400])
              big = sorted([x for x in flat(items('network-requests')) if isinstance(x, dict) and x.get('url')], key=lambda x: -(x.get('transferSize') or 0))[:5]
              if big:
                  note('notice', f'En büyük dosyalar {p}', ' | '.join(f"{x['url'][-70:]} {round((x.get('transferSize') or 0)/1024)} KB" for x in big)[:400])
              time.sleep(3)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Lighthouse (PageSpeed Insights, mobil)\n\n')
              f.write('| Sayfa | Performans | SEO | Erişilebilirlik | En iyi uyg. | LCP | CLS | TBT | Gerçek kullanıcı (CrUX) |\n')
              f.write('|---|---|---|---|---|---|---|---|---|\n')
              f.write('\n'.join(rows) + '\n\n')
              f.write(f'Eşikler: performans ≥{MIN["performance"]}, SEO ≥{MIN["seo"]}, erişilebilirlik ≥{MIN["accessibility"]}, en iyi uygulamalar ≥{MIN["best-practices"]}. Uyarı: {warns}\n')
          PY
