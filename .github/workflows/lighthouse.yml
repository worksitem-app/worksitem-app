# v83: Ücretsiz hız ve SEO ölçümü (Lighthouse CI)
#
# Canlı siteyi (worksitem.com) mobil ayarla ölçer: performans, SEO, erişilebilirlik, en iyi uygulamalar.
# - Her pazartesi 06:30 (İstanbul) ve elle (Actions › Lighthouse › Run workflow) çalışır.
# - Rapor bağlantısı iş özetine yazılır (Google'ın ücretsiz geçici depolaması, ~7 gün).
# - Eşiklerin altı yalnız UYARI verir; iş kırmızıya dönmez. Ayarlar: .github/lighthouserc.json
# Hesap, anahtar ya da ücret gerekmez.

name: Lighthouse

on:
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    # ubuntu-latest Ekim 2026'da Ubuntu 26'ya geçiyor; Chrome sorunlarına karşı sabit sürüm
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Siteye erişim kontrolü (GitHub sunucusundan)
        run: |
          UA='Mozilla/5.0 (Linux; Android 11; moto g power (2022)) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36 Chrome-Lighthouse'
          for u in / /araclar /maliyet-hesapla /araclar/banyo-maliyet-hesaplayici /araclar/boya-hesaplayici /araclar/ges-planlayici; do
            r=$(curl -s -o /dev/null -A "$UA" -w '%{http_code} %{time_total}s %{redirect_url}' --max-time 30 "https://worksitem.com$u" || echo "BAĞLANTI HATASI"); echo "::notice title=Erişim $u::$r"
          done
          which google-chrome chromium chromium-browser 2>/dev/null || true
          echo "::notice title=Chrome::$(google-chrome --version 2>&1 | head -1)"

      - name: Lighthouse (3 ölçüm, ortanca)
        id: lh
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://worksitem.com/
            https://worksitem.com/araclar
            https://worksitem.com/maliyet-hesapla
            https://worksitem.com/araclar/banyo-maliyet-hesaplayici
            https://worksitem.com/araclar/boya-hesaplayici
            https://worksitem.com/araclar/ges-planlayici
          configPath: .github/lighthouserc.json
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Hata ayrıntısı (yalnız başarısızsa)
        if: failure()
        run: |
          npx --yes @lhci/cli collect --url=https://worksitem.com/ --numberOfRuns=1 > lhci-full.txt 2>&1 || true
          grep -iE 'status code|statusCode|runtime error|ERR_|unable to|blocked|403|429|503|navigat|interstitial|security' lhci-full.txt | grep -v 'Caught exception' | sort -u | head -n 25 > lhci-err.txt
          [ -s lhci-err.txt ] || tail -n 25 lhci-full.txt > lhci-err.txt
          while IFS= read -r l; do [ -n "$l" ] && echo "::warning title=LHCI::${l:0:300}"; done < lhci-err.txt

      - name: Özet
        if: always()
        env:
          LINKS: ${{ steps.lh.outputs.links }}
          MANIFEST: ${{ steps.lh.outputs.manifest }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          links = json.loads(os.environ.get('LINKS') or '{}')
          rows = [r for r in json.loads(os.environ.get('MANIFEST') or '[]') if r.get('isRepresentativeRun')]
          print('## Lighthouse (mobil)\n')
          print('| Sayfa | Performans | SEO | Erişilebilirlik | En iyi uyg. | Rapor |')
          print('|---|---|---|---|---|---|')
          for r in rows:
              s = r.get('summary', {})
              f = lambda k: str(round(s.get(k, 0) * 100)) if k in s else '-'
              u = r['url']
              print(f"| {u.replace('https://worksitem.com', '') or '/'} | {f('performance')} | {f('seo')} | {f('accessibility')} | {f('best-practices')} | [aç]({links.get(u, '#')}) |")
          PY
